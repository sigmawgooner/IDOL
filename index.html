<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pibblock</title>
  <link rel="preload" href="fonts/aniblock.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <style>
    @font-face {
      font-family: 'aniblock';
      src: url('aniblock.ttf') format('truetype');
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'aniblock', sans-serif;
      background: radial-gradient(circle at center, #120026, #050009 80%);
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      perspective: 1000px;
    }

    /* Animated gradient wave background */
    .animated-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, #18003b, #4a0085, #18003b);
      background-size: 200% 200%;
      animation: gradientShift 10s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating glow wave */
    .bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 60%, rgba(180,0,255,0.2), transparent 70%);
      animation: glowFloat 8s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes glowFloat {
      0% { transform: scale(1) translateY(0); opacity: 0.6; }
      100% { transform: scale(1.3) translateY(-30px); opacity: 1; }
    }

    /* Particles canvas */
    canvas#particles {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* Title */
    .title {
      font-size: clamp(3.5rem, 6vw, 6rem);
      color: #e4aaff;
      text-shadow: 0 0 20px #a200ff, 0 0 40px #a200ff, 0 0 80px #a200ff;
      animation: fadeIn 1.5s ease-out, glowPulse 3s ease-in-out infinite;
      z-index: 2;
      position: relative;
    }
    .title::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shine 6s infinite;
    }

    @keyframes shine {
      0% { left: -75%; }
      100% { left: 125%; }
    }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 25px #a200ff, 0 0 50px #a200ff, 0 0 100px #a200ff; }
      50% { text-shadow: 0 0 40px #c94fff, 0 0 80px #c94fff, 0 0 140px #c94fff; }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

    /* Subtitle */
    .subtitle {
      font-size: 1.2rem;
      color: #c8a4ff;
      margin-top: 10px;
      text-shadow: 0 0 15px #8a00ff80;
      z-index: 2;
      animation: fadeIn 2s ease-out forwards;
    }

    /* Container for image + buttons */
    .container {
      z-index: 2;
      margin-top: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 150px; /* space for side buttons */
      animation: fadeIn 2s ease-out forwards;
      position: relative;
    }

    /* Logo */
    .logo {
      width: clamp(250px, 35vw, 420px);
      border-radius: 20px;
      filter: drop-shadow(0 0 35px #a200ff80);
      transition: transform 0.6s ease, filter 0.6s ease;
      z-index: 2;
    }
    .logo:hover { transform: scale(1.1) rotate(3deg); filter: drop-shadow(0 0 60px #d470ff); }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #a200ff, #d470ff);
      border: none;
      padding: 18px 35px;
      font-family: 'aniblock', sans-serif;
      font-size: 1.1rem;
      color: white;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 50% 20% 50% 20% / 30% 50% 30% 50%; /* cool custom shape */
      box-shadow: 0 0 25px #a200ff80;
      transition: all 0.3s ease;
      z-index: 2;
    }
    .btn:hover {
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 0 45px #d470ff;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      color: #8c68ff;
      text-shadow: 0 0 10px #a200ff80;
      z-index: 2;
      letter-spacing: 1px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="animated-bg"></div>
  <div class="bg-glow"></div>

  <h1 class="title">Pibblock</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="container">
    <button class="btn" id="leftBtn">Explore</button>
    <img class="logo" src="xuancuong.gif" alt="Pibblock logo">
    <button class="btn" id="rightBtn">Contact</button>
  </div>

  <footer>© 2025 Pibblock • All Rights Reserved</footer>

  <script>
    // Typewriter subtitle
    const subtitleText = "Building something beyond imagination...";
    let i = 0;
    function type() {
      if (i < subtitleText.length) {
        document.getElementById("subtitle").textContent += subtitleText.charAt(i);
        i++;
        setTimeout(type, 60);
      }
    }
    window.onload = type;

    // Glowing particles
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    canvas.width = innerWidth;
    canvas.height = innerHeight;

    const particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 1,
      dx: (Math.random() - 0.5) * 0.4,
      dy: (Math.random() - 0.5) * 0.4
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(170, 0, 255, 0.4)";
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      }
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // Mouse-based depth (3D tilt)
    document.addEventListener("mousemove", e => {
      const x = (e.clientX / window.innerWidth - 0.5) * 10;
      const y = (e.clientY / window.innerHeight - 0.5) * 10;
      document.querySelector(".container").style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    // Example button interactions
    document.getElementById("leftBtn").onclick = () => alert("Explore clicked!");
    document.getElementById("rightBtn").onclick = () => alert("Contact clicked!");
  </script>
</body>
</html>
