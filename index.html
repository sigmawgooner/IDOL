<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pibblock</title>

  <!-- preload custom font -->
  <link rel="preload" href="fonts/aniblock.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <style>
    @font-face {
      font-family: 'aniblock';
      src: url('fonts/aniblock.ttf') format('truetype');
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'aniblock', sans-serif;
      background: linear-gradient(120deg, #0b0014, #120026, #0b0014);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(180, 0, 255, 0.15), transparent 70%);
      animation: glowFloat 8s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes glowFloat {
      0% { transform: scale(1) translateY(0); opacity: 0.7; }
      100% { transform: scale(1.2) translateY(-15px); opacity: 1; }
    }

    .title {
      font-size: 5.5rem;
      margin-top: 50px;
      letter-spacing: 3px;
      color: #e0a9ff;
      text-shadow: 0 0 25px #a200ff, 0 0 50px #a200ff, 0 0 100px #a200ff;
      animation: glowPulse 3s ease-in-out infinite;
      transition: transform 0.3s ease;
      z-index: 2;
      cursor: pointer;
    }

    .title:hover {
      transform: scale(1.06);
      text-shadow: 0 0 35px #b44dff, 0 0 70px #b44dff, 0 0 130px #b44dff;
    }

    @keyframes glowPulse {
      0%, 100% {
        text-shadow: 0 0 25px #a200ff, 0 0 50px #a200ff, 0 0 100px #a200ff;
      }
      50% {
        text-shadow: 0 0 40px #c94fff, 0 0 80px #c94fff, 0 0 140px #c94fff;
      }
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      z-index: 2;
    }

    .logo {
      width: clamp(260px, 40vw, 450px);
      height: auto;
      border-radius: 20px;
      filter: drop-shadow(0 0 25px #a200ff80);
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    .logo:hover {
      transform: scale(1.1) rotate(3deg);
      filter: drop-shadow(0 0 45px #b44dff);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <h1 class="title">Pibblock</h1>
  <div class="container">
    <img class="logo" src="xuancuong.gif" alt="Pibblock logo">
  </div>

  <!-- ✅ Restored script link -->
  <script src="script.js"></script>
</body>
</html>
