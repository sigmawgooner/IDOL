<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #0f172a; /* deep blue */
      --bg2: #071129; /* darker */
      --accent: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.12);
      --text: #e6eef8;
      --muted: #b8c7db;
      --shadow: 0 10px 30px rgba(2,6,23,0.6);
      --radius: 16px;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(99,102,241,0.12), transparent),
                  linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Centering container */
    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      box-sizing:border-box;
    }

    /* Glass card */
    .card{
      width:100%;
      max-width:720px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:var(--radius);
      padding:34px;
      box-shadow:var(--shadow);
      border:1px solid var(--glass-border);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      display:flex;
      gap:20px;
      align-items:flex-start;
    }

    /* Left accent bar */
    .accent {
      width:6px;
      height:56px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(99,102,241,0.95), rgba(59,130,246,0.95));
      flex:0 0 6px;
      margin-top:2px;
    }

    .content{
      flex:1 1 auto;
    }

    h1{
      margin:0 0 8px 0;
      font-weight:600;
      font-size:20px;
      letter-spacing: -0.2px;
      color:var(--text);
    }

    p{
      margin:0 0 16px 0;
      color:var(--muted);
      line-height:1.5;
      font-size:15px;
    }

    .email{
      display:inline-block;
      padding:10px 14px;
      background: rgba(255,255,255,0.03);
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.04);
      font-weight:600;
      color:var(--text);
      text-decoration:none;
      box-shadow: 0 2px 8px rgba(2,6,23,0.35);
    }

    .meta{
      font-size:13px;
      color:#9fb0d1;
      margin-top:10px;
    }

    /* small controls area */
    .actions{
      margin-left: auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      padding:8px 12px;
      border-radius:10px;
      color:var(--text);
      font-weight:600;
      cursor:pointer;
      transition: transform .12s ease, background .12s;
      backdrop-filter: blur(6px);
    }
    .btn:hover{ transform: translateY(-3px); }
    .btn:active{ transform: translateY(-1px); }

    .note{
      font-size:12px;
      color:#9fb0d1;
      margin-top:12px;
    }

    footer {
      text-align:center;
      margin-top:18px;
      color:#8ea3c6;
      font-size:13px;
    }

    /* Responsive */
    @media (max-width:560px){
      .card{ padding:20px; flex-direction:column; gap:12px; align-items:stretch; }
      .accent{ width:100%; height:6px; border-radius:6px; margin:0 0 4px 0; }
      .actions{ margin-left:0; justify-content:flex-end; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main" aria-labelledby="contact-title">
      <div class="accent" aria-hidden="true"></div>

      <div class="content">
        <h1 id="contact-title">Contact</h1>

        <p>
          <a class="email" href="mailto:imambingus@gmail.com">imambingus@gmail.com</a>
        </p>

        <p class="meta">
          Note: you can't email me from a school email — messages sent from school/work accounts may not go through. Please use a personal/home Gmail account.
        </p>

        <div class="note" aria-live="polite">Tip: click the email to open your mail client or use the copy button.</div>
      </div>

      <div class="actions" aria-hidden="false">
        <button id="copyBtn" class="btn" title="Copy email to clipboard">Copy email</button>
        <button id="openMail" class="btn" title="Open default mail client">Email me</button>
      </div>
    </main>
  </div>

  <footer aria-hidden="true">Simple • Modern • Clean</footer>

  <script>
    const email = "imambingus@gmail.com";
    const copyBtn = document.getElementById("copyBtn");
    const openMail = document.getElementById("openMail");

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(email);
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy email", 1500);
      } catch (err) {
        // fallback
        const textarea = document.createElement("textarea");
        textarea.value = email;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); copyBtn.textContent = "Copied!"; } catch(e){ alert("Copy failed — please copy manually: " + email); }
        document.body.removeChild(textarea);
        setTimeout(() => copyBtn.textContent = "Copy email", 1500);
      }
    });

    openMail.addEventListener("click", () => {
      window.location.href = "mailto:" + email + "?subject=Hello";
    });

    // Accessibility: allow Enter on focused buttons
    [copyBtn, openMail].forEach(btn => {
      btn.addEventListener("keyup", (e) => {
        if (e.key === "Enter" || e.key === " ") btn.click();
      });
    });
  </script>
</body>
</html>
